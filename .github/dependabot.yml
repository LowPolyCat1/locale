version: 2

updates:
    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      commit-message:
          prefix: chore
      groups:
          # One PR for all compatible updates; major updates stay separate so a
          # breaking bump can't block the rest.
          cargo:
              update-types: [minor, patch]
          cargo-major:
              update-types: [major]
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
          day: monday
      open-pull-requests-limit: 5
      commit-message:
          prefix: ci
      groups:
          github-actions:
              patterns: ["*"]
