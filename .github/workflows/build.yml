name: Compilation Check

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

env:
    CARGO_TERM_COLOR: always

jobs:
    # Pull requests are compared against their base, pushes against the previous commit.
    # The gate is job-level (not `on.pull_request.paths`) so that skipped required
    # checks are still reported as successful. If the filter itself fails, `run` is
    # empty and everything runs.
    changes:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            pull-requests: read
        outputs:
            run: ${{ steps.filter.outputs.run }}
        steps:
            # Pull requests are diffed through the API; pushes need the git history.
            - uses: actions/checkout@v7
              if: github.event_name == 'push'
            - uses: dorny/paths-filter@v3
              id: filter
              with:
                  filters: |
                      run:
                          - '**/*.rs'
                          - '**/Cargo.toml'
                          - 'Cargo.lock'
                          - '.github/workflows/build.yml'

    build:
        # Matrix jobs can't be skipped with a job-level `if`: GitHub then reports a single
        # unexpanded check instead of one per matrix entry, so the required per-entry checks
        # would never be reported. On pull requests the steps are skipped instead, and only
        # the stable entries (the required checks) are started. Pushes have no required
        # checks, so there the whole job is skipped.
        needs: changes
        if: ${{ !cancelled() && (github.event_name == 'pull_request' || needs.changes.outputs.run != 'false') }}
        runs-on: ${{ matrix.os }}
        strategy:
            matrix:
                os: [ubuntu-latest, windows-latest, macos-latest]
                toolchain: ${{ fromJSON(needs.changes.outputs.run != 'false' && '["stable", "beta", "nightly"]' || '["stable"]') }}

        permissions:
            contents: read

        steps:
            - if: needs.changes.outputs.run != 'false'
              uses: actions/checkout@v7
            - if: needs.changes.outputs.run != 'false'
              name: Set up Rust
              run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
            - if: needs.changes.outputs.run != 'false'
              name: Build
              run: cargo build --verbose
            - if: needs.changes.outputs.run != 'false'
              name: Run tests
              run: cargo test --verbose
            - if: needs.changes.outputs.run != 'false'
              name: Build release
              run: cargo build --verbose --release
