name: Changelog

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Released tag (e.g. v0.3.1)
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Released tag (e.g. v0.3.1)
        required: true
        type: string

permissions:
  contents: read

jobs:
  changelog:
    runs-on: ubuntu-latest
    concurrency:
      group: changelog
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
      BOT_CLIENT_ID: ${{ secrets.BOT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: master
          fetch-depth: 0

      - name: Generate release notes
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${TAG#v}"
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$TAG^" 2>/dev/null || true)
          args=(-f tag_name="$TAG" -f target_commitish="$(git rev-parse "$TAG^{commit}")")
          if [ -n "$prev" ]; then args+=(-f previous_tag_name="$prev"); fi
          # Categories come from .github/release.yml (PR labels).
          gh api "repos/$REPO/releases/generate-notes" "${args[@]}" --jq .body > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.notes.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release edit "$TAG" --repo "$REPO" --notes-file "$RUNNER_TEMP/notes.md"
          else
            gh release create "$TAG" --repo "$REPO" --verify-tag \
              --title "locale-rs $VERSION" --notes-file "$RUNNER_TEMP/notes.md"
          fi

      # Rebuilt from master on every run: adds an entry for each released version
      # newer than the newest one in CHANGELOG.md (not only $TAG), so releases
      # made while an earlier changelog PR was still open are collected into one PR
      # instead of producing conflicting PRs.
      - name: Update CHANGELOG.md
        id: changelog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER_URL: ${{ github.server_url }}
        run: .github/scripts/update-changelog.sh "$TAG"

      - name: Create bot token
        id: app
        if: env.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Open changelog PR
        id: pr
        if: steps.changelog.outputs.versions != ''
        uses: peter-evans/create-pull-request@v8
        with:
          # Unlike GITHUB_TOKEN, the bot's pushes trigger CI, so the PR can auto-merge.
          token: ${{ steps.app.outputs.token || secrets.RELEASE_TOKEN || github.token }}
          commit-message: "docs: changelog for ${{ steps.changelog.outputs.versions }}"
          title: "docs: changelog for ${{ steps.changelog.outputs.versions }}"
          body: |
            Adds the release notes of ${{ steps.changelog.outputs.versions }} to `CHANGELOG.md`.

            This branch is regenerated from `master` after every release, so later
            releases are added to this PR instead of opening a new one.
          # One fixed branch, reset to master on every run: no conflicts between releases.
          branch: changelog/update
          delete-branch: true
          add-paths: CHANGELOG.md
          labels: |
            changelog
            automated

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-url != ''
        run: gh pr merge --auto --squash "${{ steps.pr.outputs.pull-request-url }}"
        env:
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_TOKEN || github.token }}
