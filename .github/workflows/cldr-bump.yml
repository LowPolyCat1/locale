name: CLDR bump

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    env:
      BOT_CLIENT_ID: ${{ secrets.BOT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Regenerate from latest CLDR
        run: cargo run -p locale-dev --release

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No upstream CLDR change detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read versions from manifests
        if: steps.changes.outputs.changed == 'true'
        id: meta
        shell: bash
        run: |
          cldr=$(awk -F'"' '/^\[workspace\.metadata\.cldr\]/{f=1;next} f && /^version[[:space:]]*=/{print $2; exit}' Cargo.toml)
          crate=$(awk -F'"' '/^\[package\]/{f=1;next} f && /^version[[:space:]]*=/{print $2; exit}' locale-rs/Cargo.toml)
          echo "cldr=$cldr" >> "$GITHUB_OUTPUT"
          echo "crate=$crate" >> "$GITHUB_OUTPUT"

      - name: Verify generated code builds
        if: steps.changes.outputs.changed == 'true'
        run: cargo build -p locale-rs --all-features

      - name: Create bot token
        id: app
        if: steps.changes.outputs.changed == 'true' && env.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}

      - name: Create pull request
        id: pr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          # The bot app is the only actor allowed to push to cldr-bump/* (ruleset);
          # unlike GITHUB_TOKEN, its pushes also trigger CI on the PR.
          token: ${{ steps.app.outputs.token || secrets.RELEASE_TOKEN || github.token }}
          commit-message: |
            chore: bump CLDR to ${{ steps.meta.outputs.cldr }}

            Bumps locale-rs to ${{ steps.meta.outputs.crate }}.
          title: "chore: bump CLDR to ${{ steps.meta.outputs.cldr }}"
          body: |
            Automated regeneration from upstream CLDR `${{ steps.meta.outputs.cldr }}`.

            - `locale-rs` -> `${{ steps.meta.outputs.crate }}`
            - `[workspace.metadata.cldr] version` -> `${{ steps.meta.outputs.cldr }}`

            This PR merges automatically once all required checks pass. The `semver`
            check raises the version further if needed (e.g. removed `Locale` variants
            require a breaking release). Once merged, the release workflow tags and
            publishes the new version.

            To review it by hand first, disable auto-merge on this PR.
          branch: cldr-bump/${{ steps.meta.outputs.cldr }}
          delete-branch: true
          labels: |
            cldr-bump
            automated

      - name: Enable auto-merge
        if: steps.pr.outputs.pull-request-url != ''
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
          GH_TOKEN: ${{ steps.app.outputs.token || secrets.RELEASE_TOKEN || github.token }}

      - name: Close failure issues on success
        if: success()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cldr-bump-failure',
            });
            for (const issue of issues) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                body: `The CLDR bump workflow succeeded again: ${runUrl}. Closing.`,
              });
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issue.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed #${issue.number}`);
            }

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `CLDR bump workflow failed (${context.runId})`;
            const body = [
              `The scheduled CLDR bump workflow failed.`,
              ``,
              `- Run: ${runUrl}`,
              `- Trigger: \`${context.eventName}\``,
              `- Commit: \`${context.sha}\``,
              ``,
              `Common causes: upstream renamed the \`json-full.zip\` asset, the GitHub API rate-limited the runner, or the generated code no longer builds.`,
              `Re-run via \`workflow_dispatch\` once resolved.`,
            ].join('\n');

            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'cldr-bump-failure',
              per_page: 1,
            });
            if (existing.length > 0) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['cldr-bump-failure', 'automated'],
              });
            }
