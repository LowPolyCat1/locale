name: Lint

on:
    push:
        branches: [master, main]
    pull_request:
        branches: [master, main]

jobs:
    # Only pull requests are filtered; pushes to master always run everything.
    # The gate is job-level (not `on.pull_request.paths`) so that skipped required
    # checks are still reported as successful. If the filter itself fails, `run` is
    # empty and everything runs.
    changes:
        runs-on: ubuntu-latest
        permissions:
            pull-requests: read
        outputs:
            run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
        steps:
            - uses: dorny/paths-filter@v3
              id: filter
              if: github.event_name == 'pull_request'
              with:
                  filters: |
                      run:
                          - '**/*.rs'
                          - '**/Cargo.toml'
                          - 'Cargo.lock'
                          - '**/clippy.toml'
                          - '**/.clippy.toml'
                          - '.github/workflows/clippy.yml'

    clippy:
        needs: changes
        if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
        runs-on: ubuntu-latest
        permissions:
            contents: read

        steps:
            - uses: actions/checkout@v7
            - name: Install Rust
              uses: actions-rs/toolchain@v1
              with:
                  toolchain: stable
            - name: Install Clippy
              run: rustup component add clippy
            - name: Run Clippy
              run: cargo clippy --workspace --all-targets --all-features -- -D warnings
