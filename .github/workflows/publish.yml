name: Publish locale-rs

on:
    push:
        tags:
            - "v*"
    workflow_dispatch:

jobs:
    publish:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable

            - uses: Swatinem/rust-cache@v2

            - name: Verify tag matches locale-rs version
              if: startsWith(github.ref, 'refs/tags/v')
              shell: bash
              run: |
                  tag="${GITHUB_REF#refs/tags/v}"
                  crate=$(awk -F'"' '/^\[package\]/{f=1;next} f && /^version[[:space:]]*=/{print $2; exit}' locale-rs/Cargo.toml)
                  if [ "$tag" != "$crate" ]; then
                    echo "Tag v$tag does not match locale-rs/Cargo.toml version $crate" >&2
                    exit 1
                  fi

            - name: cargo publish --dry-run
              run: cargo publish -p locale-rs --all-features --dry-run

            - name: cargo publish
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
              run: cargo publish -p locale-rs --all-features
