name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      created: ${{ steps.tag.outputs.created }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Tag locale-rs version
        id: tag
        shell: bash
        run: |
          version=$(awk -F'"' '/^\[package\]/{f=1;next} /^\[/{f=0} f && /^version[[:space:]]*=/{print $2; exit}' locale-rs/Cargo.toml)
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
            echo "Tag $tag already exists, nothing to release."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "locale-rs $version"
          git push origin "$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Created tag $tag"

  # Tags pushed with GITHUB_TOKEN don't trigger other workflows, so publish is called directly.
  publish:
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      contents: read
      actions: write
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  changelog:
    needs: [tag, publish]
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/changelog.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
    secrets: inherit

  # Open auto-merge PRs were semver-checked against the old master. Bring them up
  # to date so the check re-runs and bumps past the version that was just released.
  refresh-prs:
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - name: Update auto-merge PRs that are behind master
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::warning::RELEASE_TOKEN is not set; skipping PR refresh."
            exit 0
          fi
          gh pr list --repo "$REPO" --base master --state open --limit 100 \
            --json number,headRefOid,autoMergeRequest \
            --jq '.[] | select(.autoMergeRequest != null) | "\(.number) \(.headRefOid)"' |
          while read -r number sha; do
            behind=$(gh api "repos/$REPO/compare/$sha...master" --jq .ahead_by)
            if [ "$behind" -gt 0 ]; then
              echo "Updating #$number ($behind commits behind master)"
              gh api -X PUT "repos/$REPO/pulls/$number/update-branch" -f expected_head_sha="$sha" \
                || echo "::warning::Could not update #$number"
            fi
          done
