name: test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  # Only pull requests are filtered; pushes to master always run everything.
  # The gate is job-level (not `on.pull_request.paths`) so that skipped required
  # checks are still reported as successful. If the filter itself fails, `run` is
  # empty and everything runs.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ github.event_name != 'pull_request' || steps.filter.outputs.run == 'true' }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            run:
              - '**/*.rs'
              - '**/Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/test.yml'

  test:
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.run != 'false' }}
    runs-on: windows-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test (all features)
        run: cargo test --all-features --verbose
