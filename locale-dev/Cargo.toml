[package]
name = "locale-dev"
version = "0.2.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
thiserror = { version = "2.0.18" }
reqwest = { version = "0.13.3", features = ["blocking", "json"] }
zip = "8.6.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
quote = "1.0.45"
proc-macro2 = "1.0.106"
syn = { version = "3.0.6", features = ["full"] }
prettyplease = "0.3.0"
phf_codegen = "0.14.0"
rayon = "1.11.0"
tracing = { version = "0.1.44" }
tracing-subscriber = { version = "0.3.23" }
toml_edit = { version = "0.25.11" }

[dev-dependencies]
tempfile = "3"
